server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rmg_incident
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-strong-32-byte-or-longer-secret-key}
    expiration-ms: 3600000
  reset-password:
    expiration-minutes: 30
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
